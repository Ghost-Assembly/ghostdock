# Keeps dependencies, actions and base images current.
#
# Free on every plan and both visibilities. Updates are grouped per
# ecosystem so a week of patch releases arrives as one pull request rather
# than a dozen, which is the difference between reviewing them and ignoring
# them.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]

  # Actions are pinned by commit SHA; this is what moves the pins forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images are pinned by digest in the Dockerfile's FROM lines.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
